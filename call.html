<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライブ翻訳 通話+字幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9edef;
    --surface: #ffffff;
    --ink: #16202a;
    --muted: #5e6b75;
    --line: #d3dade;
    --ja: #2f5d8c;
    --ko: #2f6b4f;
    --warn: #9c3b25;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  select, input, button {
    font: inherit;
    font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type="text"] { min-width: 140px; }
  button {
    cursor: pointer;
    border-color: var(--ink);
    background: var(--ink);
    color: var(--surface);
    font-weight: 500;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.hangup { background: var(--warn); border-color: var(--warn); }
  button.stop { background: var(--warn); border-color: var(--warn); }
  :focus-visible { outline: 2px solid var(--ja); outline-offset: 2px; }

  #uiLang { margin-left: auto; }

  #shareLinkRow {
    padding: 6px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  #shareLinkInput { width: 100%; font-size: 13px; color: var(--muted); }

  #status {
    font-size: 13px;
    color: var(--muted);
    padding: 6px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  #status.live { color: var(--ko); }
  #status.error { color: var(--warn); }

  #callInfo {
    font-size: 12px;
    color: var(--muted);
    padding: 4px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  #sttStatus {
    font-size: 13px;
    color: var(--muted);
    padding: 6px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  #sttStatus.live { color: var(--ko); }
  #sttStatus.error { color: var(--warn); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: auto; text-align: center; }

  audio#remoteAudio { display: none; }

  .turn {
    background: var(--surface);
    border-radius: 8px;
    padding: 10px 14px;
    max-width: 68ch;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  /* 自分の発言は右、相手の発言は左。アバターは常にDOM上は先頭に置き、
     flex-directionの向きだけで見た目の左右を切り替える。            */
  .turn.own {
    border-right: 3px solid var(--turn-color);
    border-radius: 8px 0 0 8px;
    align-self: flex-end;
    flex-direction: row-reverse;
    text-align: right;
  }
  .turn.peer {
    border-left: 3px solid var(--turn-color);
    border-radius: 0 8px 8px 0;
    align-self: flex-start;
    flex-direction: row;
  }
  .avatar {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--turn-color);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }
  .turn-body { flex: 1; min-width: 0; }
  .src { font-size: 14px; color: var(--muted); }
  .dst { font-size: 22px; font-weight: 500; margin-top: 4px; }
  .dst.pending { color: var(--muted); font-weight: 400; font-size: 16px; }
  .dst.failed { color: var(--warn); font-size: 15px; font-weight: 400; }

  .system-msg {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    padding: 4px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  #interim {
    background: var(--surface);
    border-right: 3px dashed var(--line);
    border-radius: 8px 0 0 8px;
    padding: 10px 14px;
    color: var(--muted);
    font-size: 16px;
    max-width: 68ch;
    align-self: flex-end;
    text-align: right;
  }
  #interim:empty { display: none; }
  .hint { font-size: 12px; color: var(--muted); padding: 0 16px 10px; }
</style>
</head>
<body>

<header>
  <input type="text" id="roomInput" placeholder="合言葉（ルームID）" autocomplete="off">
  <button id="createRoomBtn">部屋を作る</button>
  <button id="inviteBtn">招待文をコピー</button>
  <button id="connectBtn">つなぐ</button>
  <button id="hangupBtn" class="hangup" disabled>切る</button>

  <select id="direction">
    <option id="dirOptJaKo" value="ja-ko">日本語 → 韓国語</option>
    <option id="dirOptKoJa" value="ko-ja">韓国語 → 日本語</option>
  </select>
  <button id="toggle">開始</button>

  <select id="uiLang">
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
  </select>
</header>

<div id="shareLinkRow" hidden>
  <input type="text" id="shareLinkInput" readonly>
</div>

<div id="status">合言葉を入力して「つなぐ」を押してください。</div>
<div id="callInfo">役割: - ・ 接続: - ・ ICE: -</div>
<div id="sttStatus">マイクの許可が必要です。Chrome または Edge で開いてください。</div>

<main id="log">
  <p class="empty">「つなぐ」で通話、「開始」で自分の字幕が出ます。</p>
</main>

<p class="hint" id="hint">自分のマイクだけを認識します。相手の声は認識しません。APIキーは「このブラウザに保存する」を選ばない限りこのページを閉じると消えます。</p>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, get, set, update, remove, onValue, onChildAdded, push, off, onDisconnect

const TRANSLATE_WORKER_URL = "https://live-translate-translator.soma2028.workers.dev";

const LANGS = {
  "ja-ko": { src: "ja-JP", color: "var(--ja)", code: "JA" },
  "ko-ja": { src: "ko-KR", color: "var(--ko)", code: "KO" }

    roleAnswer: "answer (나중에 들어온 쪽)",

    sttStopped: "중지됨",
    sttUnsupported: "이 기기에서는 음성 인식을 사용할 수 없습니다. Chrome이나 Edge에서 열어주세요.",
    noMic: "마이크를 찾을 수 없습니다. 연결을 확인해주세요.",
    cannotStart: "시작할 수 없습니다. 한 번 정지한 후 다시 눌러주세요.",
    logEmpty: "[연결]로 통화, [시작]으로 자막이 나옵니다.",
    hint: "자신의 마이크만 인식합니다. 상대방의 음성은 인식하지 않습니다.",
    translating: "번역 중…",
    translateFailed: "번역하지 못했습니다 ({detail})",
    emptyResponse: "빈 응답",
    peerTranslateFailed: "상대방 쪽에서 번역에 실패했습니다",
    peerJoined: "상대방이 참여했습니다",
    peerLeft: "상대방이 나갔습니다",
    batchWaiting: "…",
    state_new: "미접속",
    state_connecting: "연결 중",
    state_checking: "확인 중",
    state_connected: "연결됨",
    state_completed: "완료",
    state_disconnected: "연결 끊김",
    state_failed: "실패",
    state_closed: "종료"
  }
};

let currentLang = "ja";

// currentLangを問わず、指定した言語で文言を引く（招待文のように相手の
// 言語で作る必要があるものに使う。自分の画面の言語は変えたくないので）。
function tFor(lang, key, params = {}) {
  const dict = I18N[lang] || I18N.ja;
  const str = dict[key] ?? I18N.ja[key] ?? key;
  return str.replace(/\{(\w+)\}/g, (_, k) => (params[k] !== undefined ? params[k] : ""));
}

function t(key, params = {}) {
  return tFor(currentLang, key, params);
}

function stateLabel(state) {
  if (!state || state === "-") return "-";
  return t("state_" + state);
}

const el = {
  roomInput: document.getElementById("roomInput"),
  createRoomBtn: document.getElementById("createRoomBtn"),
  inviteBtn: document.getElementById("inviteBtn"),
  shareLinkRow: document.getElementById("shareLinkRow"),
  shareLinkInput: document.getElementById("shareLinkInput"),
  connectBtn: document.getElementById("connectBtn"),
  hangupBtn: document.getElementById("hangupBtn"),
  direction: document.getElementById("direction"),
  dirOptJaKo: document.getElementById("dirOptJaKo"),
  dirOptKoJa: document.getElementById("dirOptKoJa"),
  toggle: document.getElementById("toggle"),
  uiLang: document.getElementById("uiLang"),
  status: document.getElementById("status"),
  callInfo: document.getElementById("callInfo"),
  sttStatus: document.getElementById("sttStatus"),
  log: document.getElementById("log"),
  hint: document.getElementById("hint"),
  remoteAudio: document.getElementById("remoteAudio")
};

/* ---------- ステータス表示 ---------- */
/* 表示中の状態をkey+paramsで保持しておき、言語切替時に
   同じ状態のまま再描画できるようにする。                */

let statusState = { key: "statusInitial", params: {}, cls: "" };
let sttState = { key: "sttInitial", params: {}, cls: "" };

function renderStatus() {
  el.status.textContent = t(statusState.key, statusState.params);
  el.status.className = statusState.cls;
}

function setStatus(key, params = {}, cls = "") {
  statusState = { key, params, cls };
  renderStatus();
}

function setError(key, params = {}) {
  setStatus(key, params, "error");
}

function renderSttStatus() {
  el.sttStatus.textContent = t(sttState.key, sttState.params);
  el.sttStatus.className = sttState.cls;
}

function setSttStatus(key, params = {}, cls = "") {
  sttState = { key, params, cls };
  renderSttStatus();
}

/* ---------- Firebase 初期化 ---------- */
/* firebase-config.js は .gitignore 対象。firebase-config.example.js を
   コピーして自分のFirebaseプロジェクトの値を入れること。            */

let firebaseConfig;
try {
  ({ firebaseConfig } = await import("./firebase-config.js"));
} catch (err) {
  setError("configMissing");
  throw err;
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// TURNサーバーの設定。Metered社のOpen Relay Project（無料・公開クレデンシャル）を使用。
// NAT越え等でSTUNだけでは繋がらない場合のフォールバック。
const TURN_SERVERS = [
  { urls: "turn:global.relay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
];

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  ...TURN_SERVERS
];

/* ---------- 通話の状態 ---------- */

let pc = null;
let localStream = null;
let roomId = null;
let dataChannel = null;

// onValue/onChildAdded の購読を切断時に解除するための参照
let answerRef = null;
let offerCandidatesRef = null;
let answerCandidatesRef = null;

// タブを閉じただけでも部屋が消えるようにするためのonDisconnect登録
let roomDisconnect = null;

let roleKey = null; // null / "roleOffer" / "roleAnswer"
let connState = "-";
let iceState = "-";
let peerJoined = false; // 「相手が参加/退出しました」の二重表示を防ぐためのフラグ

function updateCallInfo() {
  el.callInfo.textContent = t("callInfoTemplate", {
    role: roleKey ? t(roleKey) : "-",
    conn: stateLabel(connState),
    ice: stateLabel(iceState)
  });
}

function stateClass(state) {
  if (state === "connected") return "live";
  if (state === "failed" || state === "disconnected" || state === "closed") return "error";
  return "";
}

function resetUI() {
  el.connectBtn.disabled = false;
  el.roomInput.disabled = false;
  el.createRoomBtn.disabled = false;
  el.inviteBtn.disabled = false;
  el.hangupBtn.disabled = true;
  roleKey = null;
  connState = "-";
  iceState = "-";
  peerJoined = false;
  updateCallInfo();
  el.remoteAudio.srcObject = null;
}

function markPeerJoined() {
  if (peerJoined) return;
  peerJoined = true;
  addSystemMessage(t("peerJoined"));
}

function markPeerLeft() {
  if (!peerJoined) return;
  peerJoined = false;
  addSystemMessage(t("peerLeft"));
}

/* ---------- DataChannel: 字幕の送受信 ---------- */
/* 音声レーン（WebRTC audio）とは完全に独立させる。
   自分のSTT確定テキストと、その翻訳結果だけを相手に送る。      */

// 相手の発言id -> { dst要素, 作成時刻 }。翻訳完了後も削除しない。
// 先出し翻訳の訂正が遅れて届いたときに、同じidで既存の吹き出しを
// 見つけて上書きするため。無制限に増えないよう、新規追加のたびに
// 30秒より古いエントリを掃除する（訂正は数秒以内に来るので十分な猶予）。
const peerPending = new Map();
const PEER_ENTRY_TTL_MS = 30_000;

function prunePeerPending() {
  const now = Date.now();
  for (const [id, entry] of peerPending) {
    if (now - entry.time > PEER_ENTRY_TTL_MS) {
      peerPending.delete(id);
    }
  }
}

function wireDataChannel() {
  dataChannel.onopen = () => {
    markPeerJoined();
  };
  dataChannel.onclose = () => {
    markPeerLeft();
  };
  dataChannel.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    handlePeerMessage(msg);
  };
}

function sendToPeer(obj) {
  if (dataChannel && dataChannel.readyState === "open") {
    dataChannel.send(JSON.stringify(obj));
  }
}

function handlePeerMessage(msg) {
  if (msg.kind === "subtitle-final") {
    const existing = peerPending.get(msg.id);
    if (existing) {
      // 同じidの2回目以降 = 先出し翻訳の訂正。既存の吹き出しの原文を
      // 書き換えて翻訳待ちに戻す（新しい吹き出しは作らない）。
      const srcEl = existing.dst.previousElementSibling;
      if (srcEl) srcEl.textContent = msg.text;
      existing.dst.className = "dst pending";
      existing.dst.textContent = t("translating");
    } else {
      prunePeerPending();
      const conf = LANGS[msg.direction] || LANGS["ja-ko"];
      const dst = addTurn(msg.text, conf, true);
      peerPending.set(msg.id, { dst, time: Date.now() });
    }
  } else if (msg.kind === "subtitle-translated") {
    const entry = peerPending.get(msg.id);
    if (!entry) return;
    entry.dst.className = "dst";
    entry.dst.textContent = msg.text;
    el.log.scrollTop = el.log.scrollHeight;
  } else if (msg.kind === "subtitle-failed") {
    const entry = peerPending.get(msg.id);
    if (!entry) return;
    entry.dst.className = "dst failed";
    entry.dst.textContent = t("peerTranslateFailed");
  }
}

/* ---------- 通話の接続 ---------- */

async function connect() {
  const inputId = el.roomInput.value.trim();
  if (!inputId) {
    setError("roomIdEmpty");
    return;
  }
  roomId = inputId;

  el.connectBtn.disabled = true;
  el.roomInput.disabled = true;
  el.createRoomBtn.disabled = true;
  el.inviteBtn.disabled = true;
  setStatus("micPreparing");

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    });
  } catch (err) {
    setError("micDenied");
    resetUI();
    return;
  }

  const roomRef = ref(db, `rooms/${roomId}`);

  try {
    const snap = await get(roomRef);
    const roomData = snap.val();

    if (roomData && roomData.offer && roomData.answer) {
      setError("alreadyTwo");
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
      resetUI();
      return;
    }

    el.hangupBtn.disabled = false;
    setStatus("signaling");

    // ここで登録しておけば、タブを閉じる／回線が切れるだけで
    // 相手を待たずに部屋データが自動で消える。
    roomDisconnect = onDisconnect(roomRef);
    roomDisconnect.remove().catch(() => {});

    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = (e) => {
      el.remoteAudio.srcObject = e.streams[0];
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      connState = pc.connectionState;
      updateCallInfo();
      setStatus("connStateMsg", { state: stateLabel(pc.connectionState) }, stateClass(pc.connectionState));

      if (connState === "disconnected" || connState === "failed" || connState === "closed") {
        markPeerLeft();
      }
    };

    pc.oniceconnectionstatechange = () => {
      if (!pc) return;
      iceState = pc.iceConnectionState;
      updateCallInfo();
      if (pc.iceConnectionState === "failed") {
        setError("iceFailed");
      }
    };

    if (!roomData || !roomData.offer) {
      /* 先に入った側: offerを作る */
      roleKey = "roleOffer";
      updateCallInfo();

      dataChannel = pc.createDataChannel("subtitles");
      wireDataChannel();

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          push(ref(db, `rooms/${roomId}/offerCandidates`), e.candidate.toJSON());
        }
      };

      const offerDesc = await pc.createOffer();
      await pc.setLocalDescription(offerDesc);
      await set(roomRef, {
        offer: { type: offerDesc.type, sdp: offerDesc.sdp }
      });

      answerRef = ref(db, `rooms/${roomId}/answer`);
      onValue(answerRef, async (s) => {
        const answer = s.val();
        if (answer && pc && !pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
      });

      answerCandidatesRef = ref(db, `rooms/${roomId}/answerCandidates`);
      onChildAdded(answerCandidatesRef, (s) => {
        if (pc) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(() => {});
      });
    } else {
      /* 後から入った側: answerを返す */
      roleKey = "roleAnswer";
      updateCallInfo();

      pc.ondatachannel = (e) => {
        dataChannel = e.channel;
        wireDataChannel();
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          push(ref(db, `rooms/${roomId}/answerCandidates`), e.candidate.toJSON());
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(roomData.offer));
      const answerDesc = await pc.createAnswer();
      await pc.setLocalDescription(answerDesc);
      await update(roomRef, {
        answer: { type: answerDesc.type, sdp: answerDesc.sdp }
      });

      offerCandidatesRef = ref(db, `rooms/${roomId}/offerCandidates`);
      onChildAdded(offerCandidatesRef, (s) => {
        if (pc) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(() => {});
      });
    }
  } catch (err) {
    if (isPermissionDenied(err)) {
      setError("roomIdTooShort");
    } else {
      setError("firebaseError", { message: err.message });
    }
    if (roomDisconnect) { roomDisconnect.cancel().catch(() => {}); roomDisconnect = null; }
    if (pc) { pc.close(); pc = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    resetUI();
  }
}

function isPermissionDenied(err) {
  // Firebase SDKは "PERMISSION_DENIED" ではなく "Permission denied" のように
  // 区切り文字も大文字小文字もまちまちで投げてくるため、単語の部分一致で判定する。
  const text = `${err?.code || ""} ${err?.message || ""}`.toUpperCase();
  return text.includes("PERMISSION") && text.includes("DENIED");
}

async function hangup() {
  if (answerRef) { off(answerRef); answerRef = null; }
  if (offerCandidatesRef) { off(offerCandidatesRef); offerCandidatesRef = null; }
  if (answerCandidatesRef) { off(answerCandidatesRef); answerCandidatesRef = null; }

  if (roomDisconnect) {
    await roomDisconnect.cancel().catch(() => {});
    roomDisconnect = null;
  }

  if (dataChannel) {
    // 自分から切るときは「相手が退出しました」を出したくないので、
    // close()自体が発火させるイベントを先に外しておく。
    dataChannel.onopen = null;
    dataChannel.onclose = null;
    dataChannel.onmessage = null;
    dataChannel.close();
    dataChannel = null;
  }
  peerPending.clear();

  if (pc) {
    pc.onconnectionstatechange = null;
    pc.oniceconnectionstatechange = null;
    pc.close();
    pc = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (roomId) {
    await remove(ref(db, `rooms/${roomId}`)).catch(() => {});
    roomId = null;
  }

  resetUI();
  setStatus("hangupDone");
}

el.connectBtn.addEventListener("click", connect);
el.hangupBtn.addEventListener("click", hangup);

/* ---------- 部屋の作成: 合言葉をリンクにして共有する ---------- */

function generateRoomId() {
  // 9バイト→base64urlで12文字ちょうど。DBルールの12文字以上を満たす。
  const bytes = crypto.getRandomValues(new Uint8Array(9));
  let binary = "";
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_");
}

// 生成済みのリンクをここで保持する。shareLinkInputの表示は
// 招待文コピー失敗時に一時的に別の内容へ差し替わるため、
// 「部屋が作成済みかどうか」の判定はこの変数を正とする。
let currentRoomLink = null;

function ensureRoomLink() {
  if (!currentRoomLink) {
    const newRoomId = generateRoomId();
    el.roomInput.value = newRoomId;
    currentRoomLink = `${location.origin}${location.pathname}?room=${newRoomId}`;
    history.replaceState(null, "", `?room=${newRoomId}`);
  }
  el.shareLinkInput.value = currentRoomLink;
  el.shareLinkRow.hidden = false;
  return currentRoomLink;
}

async function createRoom() {
  const roomLink = ensureRoomLink();

  // 招待文コピーと同じく、相手の言語（自分の逆）をlangで付けておく。
  // 送り間違い（相手に自分と同じUI言語のリンクを送ってしまう）を防ぐため。
  const inviteLang = currentLang === "ko" ? "ja" : "ko";
  const link = `${roomLink}&lang=${inviteLang}`;
  el.shareLinkInput.value = link;

  try {
    await navigator.clipboard.writeText(link);
    setStatus("linkCopied");
  } catch {
    setStatus("linkCopyFailed");
    el.shareLinkInput.select();
  }
}

async function copyInvite() {
  const roomLink = ensureRoomLink();

  // 招待文は相手向け。自分のUI言語とは逆の言語（＝相手の言語）で作る。
  // 自分の画面の表示言語（currentLang）はここでは一切変更しない。
  const inviteLang = currentLang === "ko" ? "ja" : "ko";
  const link = `${roomLink}&lang=${inviteLang}`;
  const text = tFor(inviteLang, "inviteTemplate", { link });

  try {
    await navigator.clipboard.writeText(text);
    setStatus("inviteCopied");
  } catch {
    setStatus("inviteCopyFailed");
    el.shareLinkInput.value = text;
    el.shareLinkInput.select();
  }
}

el.createRoomBtn.addEventListener("click", createRoom);
el.inviteBtn.addEventListener("click", copyInvite);

// リンクで開かれた場合、URLの?roomを合言葉欄に反映しておく。
// ?langがあれば、そのUI言語と対応する翻訳方向を初期選択しておく
// （招待文コピーで付与したものを開いた側の初期設定）。
const sharedParams = new URLSearchParams(location.search);
const sharedRoomId = sharedParams.get("room");
if (sharedRoomId) {
  el.roomInput.value = sharedRoomId;
}

const sharedLang = sharedParams.get("lang");
if (sharedLang === "ja" || sharedLang === "ko") {
  currentLang = sharedLang;
  el.uiLang.value = sharedLang;
  el.direction.value = sharedLang === "ko" ? "ko-ja" : "ja-ko";
}

/* ---------- STT: 差し替え可能なインターフェース ---------- */
/* index.html と同じロジック。後で差し替えるときは start/stop と
   同じ形のクラスを書いて new する行だけ差し替えればいい。      */

// 4分ごとに自分から止めて即座に再起動する。長時間の連続認識で精度が
// 落ちるブラウザ対策。切り替え時に発話が欠けないよう、新しい方を
// 先に立ち上げてから、少し重ねて（オーバーラップ）古い方を止める。
const STT_CYCLE_INTERVAL_MS = 4 * 60 * 1000;
const STT_CYCLE_OVERLAP_MS = 300;

class WebSpeechSTT {
  constructor({ lang, onInterim, onFinal, onState }) {
    this.lang = lang;
    this.onInterim = onInterim;
    this.onFinal = onFinal;
    this.onState = onState;
    this.running = false;
    this.rec = null;
    this.restartTimer = null;
    this.cycleTimer = null;
  }

  start() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      this.onState("sttUnsupported", "error");
      return false;
    }
    this.running = true;
    this._spawn(SR);
    return true;
  }

  _spawn(SR) {
    const rec = new SR();
    rec.lang = this.lang;
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = () => {
      this.onState("sttListening", "live");
      clearTimeout(this.cycleTimer);
      this.cycleTimer = setTimeout(() => this._cycle(SR), STT_CYCLE_INTERVAL_MS);
    };

    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const text = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          const t = text.trim();
          if (t) this.onFinal(t);
        } else {
          interim += text;
        }
      }
      this.onInterim(interim);
    };

    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        this.running = false;
        this.onState("micDenied", "error");
      } else if (e.error === "audio-capture") {
        this.running = false;
        this.onState("noMic", "error");
      }
      // no-speech / network / aborted は onend の再起動にまかせる
    };

    // Web Speech API は数十秒〜数分で勝手に止まる。
    // running のあいだは張り直し続けるのがこのループ。
    rec.onend = () => {
      // すでに次のインスタンスに切り替わっている（4分サイクル or
      // このonend自身の再起動）場合、古い方のonendは何もしない。
      if (this.rec !== rec) return;

      if (!this.running) {
        this.onState("sttStopped");
        return;
      }
      this.onState("sttReconnecting");
      clearTimeout(this.restartTimer);
      this.restartTimer = setTimeout(() => {
        if (this.running) this._spawn(SR);
      }, 250);
    };

    this.rec = rec;
    try {
      rec.start();
    } catch (err) {
      this.onState("cannotStart", "error");
    }
  }

  // 4分経過時の定期再起動。新しい認識を先に始め、少し重ねてから
  // 古い方を止める。
  _cycle(SR) {
    if (!this.running) return;
    const oldRec = this.rec;

    this._spawn(SR);

    setTimeout(() => {
      try { oldRec.stop(); } catch {}
    }, STT_CYCLE_OVERLAP_MS);
  }

  stop() {
    this.running = false;
    clearTimeout(this.restartTimer);
    clearTimeout(this.cycleTimer);
    if (this.rec) this.rec.abort();
    this.onInterim("");
    this.onState("sttStopped");
  }
}

/* ---------- 翻訳（Cloudflare Worker経由でAzure Translatorを呼ぶ） ---------- */

const queue = [];            // 順番を崩さないための直列キュー
let draining = false;

function formatErrorDetail(message) {
  if (message === "EMPTY_RESPONSE") return t("emptyResponse");
  return message;
}

async function translate(text, direction) {
  const [from, to] = direction.split("-");
  const body = JSON.stringify({ text, from, to });

  // 429（レート制限）・503（一時的な過負荷）だけ、1.5秒待って1回だけ再試行する。
  // それ以外のエラーは再試行せず、その場で失敗にする。
  for (let attempt = 0; attempt < 2; attempt++) {
    const res = await fetch(TRANSLATE_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body
    });

    if (res.ok) {
      const data = await res.json();
      if (!data.text) throw new Error("EMPTY_RESPONSE");
      return data.text;
    }

    if ((res.status === 429 || res.status === 503) && attempt === 0) {
      await new Promise(r => setTimeout(r, 1500));
      continue;
    }

    throw new Error("HTTP " + res.status);
  }
}

function enqueue(job) {
  queue.push(job);
  if (!draining) drain();
}

async function drain() {
  draining = true;
  while (queue.length) {
    const job = queue.shift();
    await job();
  }
  draining = false;
}

/* ---------- 表示 ---------- */

const interimEl = document.createElement("div");
interimEl.id = "interim";

// interim（暫定認識結果）が1.2秒変化しなかったら、確定を待たずに
// 先出しで翻訳を始める。字幕の遅延を減らすための先読み。
// 正式なfinalが来たときの答え合わせは handleFinal 側で行う。
const INTERIM_STABLE_MS = 1200;
let interimStableTimer = null;
let lastInterimText = "";

function showInterim(text) {
  if (!text) {
    interimEl.remove();
    clearTimeout(interimStableTimer);
    lastInterimText = "";
    return;
  }
  interimEl.textContent = text;
  el.log.appendChild(interimEl);
  el.log.scrollTop = el.log.scrollHeight;

  if (text !== lastInterimText) {
    lastInterimText = text;
    clearTimeout(interimStableTimer);
    interimStableTimer = setTimeout(() => handleStableInterim(text), INTERIM_STABLE_MS);
  }
}

function addSystemMessage(text) {
  el.log.querySelector(".empty")?.remove();

  const msg = document.createElement("div");
  msg.className = "system-msg";
  msg.textContent = text;

  el.log.insertBefore(msg, interimEl.parentNode === el.log ? interimEl : null);
  el.log.scrollTop = el.log.scrollHeight;
}

function addTurn(srcText, conf, isPeer = false) {
  el.log.querySelector(".empty")?.remove();

  const turn = document.createElement("div");
  turn.className = "turn " + (isPeer ? "peer" : "own");
  turn.style.setProperty("--turn-color", conf.color);

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = conf.code;

  const body = document.createElement("div");
  body.className = "turn-body";

  const src = document.createElement("div");
  src.className = "src";
  src.textContent = srcText;

  const dst = document.createElement("div");
  dst.className = "dst pending";
  dst.textContent = t("translating");

  body.append(src, dst);
  turn.append(avatar, body);
  el.log.insertBefore(turn, interimEl.parentNode === el.log ? interimEl : null);

  // 長時間の通話でDOMが膨らむのを防ぐ
  const turns = el.log.querySelectorAll(".turn");
  if (turns.length > 40) turns[0].remove();

  el.log.scrollTop = el.log.scrollHeight;
  return dst;
}

/* ---------- STTの配線 ---------- */

let stt = null;

// 短い確定（「あー」「うん」など）はすぐ翻訳せず、0.5秒待って
// その間に次の確定が来たら結合する。待っているあいだも
// 原文（src）はその場で伸びていくのが見える。
// （Azureは回数制限が緩いので、以前の1.5秒より結合の必要性は下がっている）
const BATCH_MIN_LENGTH = 8;
const BATCH_WAIT_MS = 500;
let pendingBatch = null; // { text, srcEl, dst, conf, direction, timer }

function startBatch(text, conf, direction) {
  const dst = addTurn(text, conf, false);
  dst.className = "dst pending";
  dst.textContent = t("batchWaiting");
  const srcEl = dst.previousElementSibling;

  pendingBatch = {
    text,
    srcEl,
    dst,
    conf,
    direction,
    timer: setTimeout(flushBatch, BATCH_WAIT_MS)
  };
}

function flushBatch() {
  if (!pendingBatch) return;
  const { text, direction, dst } = pendingBatch;
  clearTimeout(pendingBatch.timer);
  pendingBatch = null;
  translateAndSend(text, direction, dst);
}

// idを指定しなければ新しい発言として、指定すればそのidの吹き出しを
// 訂正（原文を上書きして翻訳し直す）扱いで送信する。
function translateAndSend(text, direction, dst, id = crypto.randomUUID()) {
  dst.className = "dst pending";
  dst.textContent = t("translating");

  sendToPeer({ kind: "subtitle-final", id, text, direction });

  enqueue(async () => {
    try {
      const out = await translate(text, direction);
      dst.className = "dst";
      dst.textContent = out;
      sendToPeer({ kind: "subtitle-translated", id, text: out });
    } catch (err) {
      dst.className = "dst failed";
      dst.textContent = t("translateFailed", { detail: formatErrorDetail(err.message) });
      sendToPeer({ kind: "subtitle-failed", id, reason: "error" });
    }
    el.log.scrollTop = el.log.scrollHeight;
  });

  return id;
}

// 4分サイクルのオーバーラップ中、新旧2つの認識インスタンスが同じ発話を
// それぞれ確定させることがあるため、直前3秒以内の同一テキストは無視する。
const DEDUPE_WINDOW_MS = 3000;
const recentFinals = []; // [{ text, time }]

function isDuplicateFinal(text) {
  const now = Date.now();
  while (recentFinals.length && now - recentFinals[0].time > DEDUPE_WINDOW_MS) {
    recentFinals.shift();
  }
  const isDup = recentFinals.some(f => f.text === text);
  recentFinals.push({ text, time: now });
  return isDup;
}

// interimが0.8秒安定したときに先出しで翻訳を始めた吹き出し。
// 正式なfinalが来るまでの間だけ保持する（同時に1件まで）。
let provisionalTurn = null; // { text, dst, conf, direction, id }

function handleStableInterim(text) {
  if (pendingBatch || provisionalTurn) return;
  if (text.length < BATCH_MIN_LENGTH) return;

  const direction = el.direction.value;
  const conf = LANGS[direction];
  const dst = addTurn(text, conf, false);
  const id = translateAndSend(text, direction, dst);
  provisionalTurn = { text, dst, conf, direction, id };
}

function retranslateTurn(pending, newText) {
  const srcEl = pending.dst.previousElementSibling;
  if (srcEl) srcEl.textContent = newText;
  translateAndSend(newText, pending.direction, pending.dst, pending.id);
}

function handleFinal(text) {
  if (provisionalTurn) {
    const pending = provisionalTurn;
    provisionalTurn = null;
    recentFinals.push({ text, time: Date.now() });

    // 先出し翻訳の原文と実際のfinalが違っていたときだけ翻訳し直す。
    if (text !== pending.text) {
      retranslateTurn(pending, text);
    }
    return;
  }

  if (isDuplicateFinal(text)) return;

  const direction = el.direction.value;
  const conf = LANGS[direction];

  if (pendingBatch) {
    pendingBatch.text += text;
    pendingBatch.srcEl.textContent = pendingBatch.text;
    clearTimeout(pendingBatch.timer);
    pendingBatch.timer = setTimeout(flushBatch, BATCH_WAIT_MS);
    el.log.scrollTop = el.log.scrollHeight;
    return;
  }

  if (text.length < BATCH_MIN_LENGTH) {
    startBatch(text, conf, direction);
    return;
  }

  const dst = addTurn(text, conf, false);
  translateAndSend(text, direction, dst);
}

el.toggle.addEventListener("click", () => {
  if (stt && stt.running) {
    stt.stop();
    stt = null;
    el.toggle.textContent = t("startBtn");
    el.toggle.classList.remove("stop");
    el.direction.disabled = false;
    return;
  }

  const conf = LANGS[el.direction.value];
  stt = new WebSpeechSTT({
    lang: conf.src,
    onInterim: showInterim,
    onFinal: handleFinal,
    onState: (key, cls) => setSttStatus(key, {}, cls)
  });

  if (stt.start()) {
    el.toggle.textContent = t("stopBtn");
    el.toggle.classList.add("stop");
    el.direction.disabled = true;
  } else {
    stt = null;
  }
});

/* ---------- 表示言語の切替 ---------- */
/* UI言語を切り替えたら、翻訳方向（誰の発話をどちらに訳すか）も
   対応する組み合わせに自動で合わせる。手動で戻したい場合のために
   セレクト自体は変更可能なまま残す。                              */

function applyI18n() {
  document.documentElement.lang = currentLang;

  el.roomInput.placeholder = t("roomPlaceholder");
  el.createRoomBtn.textContent = t("createRoomBtn");
  el.inviteBtn.textContent = t("inviteBtn");
  el.connectBtn.textContent = t("connectBtn");
  el.hangupBtn.textContent = t("hangupBtn");
  el.toggle.textContent = t(stt && stt.running ? "stopBtn" : "startBtn");
  el.dirOptJaKo.textContent = t("directionJaKo");
  el.dirOptKoJa.textContent = t("directionKoJa");
  el.hint.textContent = t("hint");

  const emptyEl = el.log.querySelector(".empty");
  if (emptyEl) emptyEl.textContent = t("logEmpty");

  renderStatus();
  renderSttStatus();
  updateCallInfo();
}

el.uiLang.addEventListener("change", () => {
  currentLang = el.uiLang.value;
  el.direction.value = currentLang === "ko" ? "ko-ja" : "ja-ko";
  applyI18n();
});

applyI18n();
</script>
</body>
</html>
